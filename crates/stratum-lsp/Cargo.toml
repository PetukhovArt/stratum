[package]
name = "stratum-lsp"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stratum LSP server."

[lints]
workspace = true

[[bin]]
name = "stratum-lsp"
path = "src/main.rs"

[dependencies]
stratum-core = { path = "../stratum-core" }
stratum-graph = { path = "../stratum-graph" }
stratum-config = { path = "../stratum-config" }
stratum-engine = { path = "../stratum-engine" }
notify = "6"
tower = "0.4"
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json.workspace = true
camino.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
tempfile = "3"

[[bench]]
name = "diagnostics_latency"
harness = false
