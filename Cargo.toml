[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PetukhovArt/stratum"
authors = ["PetukhovArt"]

[workspace.dependencies]
salsa = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
miette = { version = "7", features = ["fancy"] }
thiserror = "1"
insta = { version = "1", features = ["yaml"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
oxc_parser = "0.30"
oxc_ast = "0.30"
oxc_semantic = "0.30"
oxc_resolver = "4"
oxc_allocator = "0.30"
oxc_span = "0.30"
oxc_syntax = "0.30"
walkdir = "2"
camino = { version = "1", features = ["serde1"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
