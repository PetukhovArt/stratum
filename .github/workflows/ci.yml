name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/stratum-visualizer-frontend/package.json
      - name: npm install
        working-directory: frontend/stratum-visualizer-frontend
        run: npm install --no-audit --no-fund
      - name: npm run build
        working-directory: frontend/stratum-visualizer-frontend
        run: npm run build
      - name: bundle size budget
        working-directory: frontend/stratum-visualizer-frontend
        run: |
          size=$(du -sb dist | cut -f1)
          echo "Bundle: $size bytes"
          if [ "$size" -gt 1572864 ]; then
            echo "::error::Frontend bundle exceeds 1.5MB budget ($size bytes)"
            exit 1
          fi
