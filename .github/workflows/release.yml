name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-dist
        run: cargo install cargo-dist --locked
      - name: cargo dist plan
        run: cargo dist plan --tag ${{ github.ref_name }}

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build frontend bundle
        working-directory: frontend/stratum-visualizer-frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: install cargo-dist
        run: cargo install cargo-dist --locked
      - name: cargo dist build
        run: cargo dist build --target ${{ matrix.target }} --tag ${{ github.ref_name }}
      - name: artifact size budget
        shell: bash
        run: |
          mapfile -t bins < <(find target/distrib -maxdepth 2 -type f \( -name 'stratum-lint*' -o -name 'stratum-lsp*' \))
          for bin in "${bins[@]}"; do
            size=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
            echo "$bin → $size bytes"
            if [ "$size" -gt 26214400 ]; then
              echo "::error::$bin exceeds the 25MB CI ceiling"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/distrib/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: target/distrib
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: target/distrib/**
          generate_release_notes: true
