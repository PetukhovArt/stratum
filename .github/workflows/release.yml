name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-dist
        run: cargo install cargo-dist --locked --version 0.20.0
      - name: cargo dist plan
        run: |
          mkdir -p target/distrib
          if ! cargo dist plan --tag ${{ github.ref_name }} --output-format=json > target/distrib/dist-manifest.json 2> plan.err; then
            cat plan.err
            echo "::error title=cargo dist plan::$(tr '\n' ' ' < plan.err | cut -c1-900)"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: dist-manifest
          path: target/distrib/dist-manifest.json

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # glibc 2.35: runs on Debian bookworm (node:22) and newer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: build frontend bundle
        working-directory: frontend/stratum-visualizer-frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: install cargo-dist
        run: cargo install cargo-dist --locked --version 0.20.0
      - name: cargo dist build
        run: cargo dist build --target ${{ matrix.target }} --tag ${{ github.ref_name }}
      - name: artifact size budget
        shell: bash
        run: |
          mapfile -t bins < <(find target/distrib -maxdepth 2 -type f \( -name 'stratum-lint*' -o -name 'stratum-lsp*' \))
          for bin in "${bins[@]}"; do
            size=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
            echo "$bin → $size bytes"
            if [ "$size" -gt 26214400 ]; then
              echo "::error::$bin exceeds the 25MB CI ceiling"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.target }}
          path: target/distrib/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: target/distrib
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: target/distrib/**
          generate_release_notes: true

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: target/distrib
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: pack npm packages
        run: node scripts/npm-pack.mjs target/distrib target/npm > target/npm-publish-order.txt
      - name: publish platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          while read -r tarball; do
            npm publish "$tarball" --access public --provenance --tag "$dist_tag"
          done < target/npm-publish-order.txt
