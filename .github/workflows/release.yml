name: release

on:
  # A version bump landing on main is the release: this workflow builds it, tags it, writes the
  # GitHub release from CHANGELOG.md and publishes npm. A tag pushed with GITHUB_TOKEN starts no
  # workflow, so the tag records what shipped instead of triggering it. A tag pushed by hand
  # re-releases that commit.
  push:
    branches: [main]
    tags: ['v*']
  # Dry run: the whole build matrix and the npm packing, nothing published.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: one version everywhere
        run: node scripts/check-version.mjs
      - id: decide
        shell: bash
        run: |
          version=$(node scripts/check-version.mjs --print)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/v*)
              [ "${GITHUB_REF_NAME#v}" = "$version" ] ||
                { echo "::error::tag $GITHUB_REF_NAME != workspace version $version"; exit 1; }
              build=true; release=true ;;
            refs/heads/main)
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "v$version is already released"
                build=false; release=false
              else
                echo "v$version is new: releasing"
                build=true; release=true
              fi ;;
            *) build=true; release=false ;;
          esac
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && { build=true; release=false; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: release notes exist
        if: steps.decide.outputs.release == 'true'
        run: node scripts/release-notes.mjs "${{ steps.decide.outputs.version }}" > /dev/null

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04 # glibc 2.35: runs on Debian bookworm (node:22) and newer
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: build frontend bundle
        working-directory: frontend/stratum-visualizer-frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p stratum-lint -p stratum-lsp
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          name=stratum-lint-${{ matrix.target }}
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$name.zip" "./$dir/stratum-lint.exe" "./$dir/stratum-lsp.exe" README.md LICENSE CHANGELOG.md
          else
            tar -czf "$name.tar.gz" -C "$dir" stratum-lint stratum-lsp -C "$GITHUB_WORKSPACE" README.md LICENSE CHANGELOG.md
          fi
          for bin in "$dir"/stratum-lint* "$dir"/stratum-lsp*; do
            case "$bin" in *.d|*.pdb) continue ;; esac
            size=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
            echo "$bin: $size bytes"
            [ "$size" -le 26214400 ] || { echo "::error::$bin exceeds the 25MB ceiling"; exit 1; }
          done
      - uses: actions/upload-artifact@v5
        with:
          name: archive-${{ matrix.target }}
          path: stratum-lint-${{ matrix.target }}.*

  npm-pack:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: pack npm packages
        run: node scripts/npm-pack.mjs archives "${{ needs.gate.outputs.version }}" npm-out > npm-out.txt
      - uses: actions/upload-artifact@v5
        with:
          name: npm-tarballs
          path: |
            npm-out/*.tgz
            npm-out.txt

  release:
    needs: [gate, build, npm-pack]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: release notes
        run: node scripts/release-notes.mjs "$VERSION" > RELEASE_NOTES.md
      - name: tag this version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: v${{ needs.gate.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: archives/*

  npm:
    needs: [gate, release]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: npm-tarballs
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Platform packages first: a launcher whose optionalDependencies do not resolve yet is a
      # broken install for anyone installing in between.
      - name: publish platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while read -r tarball; do
            npm publish "npm-out/$(basename "$tarball")" --access public --provenance
          done < npm-out.txt
