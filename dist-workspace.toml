# cargo-dist configuration for the Stratum workspace.
# See https://opensource.axo.dev/cargo-dist/

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.20.0"
ci = "github"
installers = ["shell", "powershell", "npm", "homebrew"]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
allow-dirty = ["ci"]
install-path = ["$CARGO_HOME/bin/", "~/.local/bin/"]
binaries = ["stratum-lint", "stratum-lsp"]
windows-archive = ".zip"
unix-archive = ".tar.gz"
